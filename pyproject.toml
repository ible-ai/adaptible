[project]
name = "adaptible"
version = "1.0.0a3"
description = "Stateful LLM serving instances that self-reflect and learn from their mistakes during periods of low server utilization."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "absl-py",
    "ddgs",
    "fastapi[all]",
    "immutabledict",
    "mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tqdm",
    "transformers",
    "uvicorn[standard]",
    "vizible",
]

[project.optional-dependencies]
wrap = ["torch", "peft", "gguf>=0.17", "httpx", "filelock", "lmstudio>=1.5"]
dev = ["black==25.9.0", "ruff==0.14.0"]

[project.scripts]
adaptible = "adaptible.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adaptible"]
exclude = [
    "**/logs",
    "**/*_test.py",
    "adaptible/wrap/tiny_models.py",
    "adaptible/wrap/model_backed_runtime.py",
    "adaptible/wrap/fixtures",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "**/logs",
    "outputs",
    "notebooks",
    ".github",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# Correctness and hygiene only: formatting belongs to black.
#   E/F  pyflakes + pycodestyle errors   B   likely bugs (bugbear)
#   I    import ordering                 UP  modern syntax
#   T20  stray print()                   LOG/G  logging misuse
#   PIE, RET, SIM  small clarity wins
select = ["E", "F", "B", "I", "UP", "T20", "LOG", "G", "PIE", "RET", "SIM"]
ignore = [
    "E501",    # line length is black's job
    "B008",    # FastAPI depends() style
    "SIM105",  # contextlib.suppress hides the logging we just added
]

[tool.ruff.lint.per-file-ignores]
# The CLI and scripts talk to the user on stdout by design.
"adaptible/__main__.py" = ["T20"]
"adaptible/wrap/__main__.py" = ["T20"]
"adaptible/local/cli.py" = ["T20"]
"adaptible/wrap/references.py" = ["T20"]
"scripts/*.py" = ["T20"]
"scripts/dev/*.py" = ["T20"]

[tool.hatch.metadata]
allow-direct-references = true
