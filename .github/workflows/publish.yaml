name: Publish Python Package to PyPI

on:
  release:
    types: [created] # Trigger on a new GitHub release
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    # Must match the environment named in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/adaptible

    # Mandatory for trusted publishing: PyPI accepts this workflow's OIDC
    # token instead of a stored API token.
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
