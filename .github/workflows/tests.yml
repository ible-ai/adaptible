name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    # Scoped to the runtime wrapper's modules for now; the older MLX experiment
    # code and the tests beside the modules are not reformatted by this gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install formatter and linter
        run: python -m pip install 'black==25.9.0' 'ruff==0.14.0'
      - name: black
        run: |
          python -m black --check \
            --extend-exclude '(_test|tiny_models|model_backed_runtime)\.py$' \
            adaptible/wrap adaptible/__main__.py
      - name: ruff
        run: |
          python -m ruff check \
            --extend-exclude '*_test.py,tiny_models.py,model_backed_runtime.py' \
            adaptible/wrap adaptible/__main__.py

  unit:
    # MLX requires Apple Silicon; macos-14+ hosted runners are arm64.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[wrap,dev]'

      - name: Import check
        run: python -c "import adaptible"

      # No pretrained models: adapter_test trains a tiny random model. The
      # real-checkpoint llm_test / integration_test suites run locally instead.
      - name: Unit tests
        env:
          ADAPTIBLE_OUTPUTS_DIR: ${{ runner.temp }}/adaptible-outputs
        run: |
          python -m unittest \
            adaptible.classes_test \
            adaptible.local.api_test \
            adaptible.local.local_test \
            adaptible.paths_test \
            adaptible.eval.eval_test \
            adaptible.autonomous.autonomous_test \
            adaptible.local.cli_test \
            adaptible.repair_test \
            adaptible.adapter_test \
            adaptible.wrap.wrap_test \
            adaptible.wrap.cli_test \
            adaptible.wrap.config_test \
            adaptible.wrap.train_worker_test \
            adaptible.wrap.gguf_roundtrip_test \
            adaptible.wrap.runtime_command_test \
            adaptible.wrap.ollama_fusion_test \
            scripts.wrapper_smoke_test \
            scripts.wrapper_recurrent_test \
            scripts.wrapper_thinking_test \
            adaptible.wrap.thinking_runtime_test \
            adaptible.wrap.thinking_mode_test \
            adaptible.wrap.thinking_draft_test \
            scripts.wrapper_sustained_test \
            adaptible.wrap.question_candidate_test \
            adaptible.wrap.scope_router_test \
            adaptible.wrap.fact_scope_test \
            adaptible.wrap.fact_scope_audit_test \
            adaptible.wrap.scope_api_test \
            adaptible.wrap.ollama_context_test \
            adaptible.wrap.ollama_thinking_test \
            adaptible.wrap.source_lineage_test \
            adaptible.wrap.references_test \
            adaptible.wrap.reference_integration_test \
            adaptible.wrap.grounding_quality_test \
            adaptible.wrap.source_property_guard_test \
            adaptible.wrap.source_relevance_test \
            adaptible.wrap.retention_test \
            adaptible.wrap.training_resume_test \
            adaptible.wrap.thinking_retry_test \
            adaptible.wrap.training_budget_test \
            adaptible.wrap.training_optimizer_test \
            adaptible.wrap.training_examples_test \
            adaptible.wrap.vllm_test \
            scripts.wrapper_integration_test \
            adaptible.wrap.experiment_equivalence_test \
            adaptible.wrap.runtime_parity_test \
            adaptible.wrap.question_candidate_structural_test \
            adaptible.wrap.loop_breaker_test \
            scripts.wrapper_parity_test \
            adaptible.revise_test \
            -v

  end-to-end:
    # Real model, real LoRA, real adapter artefacts through all four runtime
    # codepaths. Minutes rather than seconds, so it runs beside the fast suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[wrap]'
      - name: Wrapper end-to-end
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          ADAPTIBLE_OUTPUTS_DIR: ${{ runner.temp }}/adaptible-outputs
        run: |
          python -m unittest \
            adaptible.wrap.end_to_end_test \
            adaptible.wrap.train_worker_test \
            adaptible.wrap.gguf_roundtrip_test -v

  torch-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[wrap]'
      - name: Tiny random model adapter test (no checkpoint downloads)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python -m unittest scripts.colab.runner_test \
            adaptible.wrap.wrap_test adaptible.wrap.cli_test \
            adaptible.wrap.config_test \
            adaptible.wrap.train_worker_test \
            adaptible.wrap.gguf_roundtrip_test \
            scripts.wrapper_smoke_test \
            scripts.wrapper_recurrent_test \
            scripts.wrapper_thinking_test \
            adaptible.wrap.thinking_runtime_test \
            adaptible.wrap.thinking_mode_test \
            adaptible.wrap.thinking_draft_test \
            scripts.wrapper_sustained_test \
            adaptible.wrap.question_candidate_test \
            adaptible.wrap.scope_router_test \
            adaptible.wrap.fact_scope_test \
            adaptible.wrap.fact_scope_audit_test \
            adaptible.wrap.scope_api_test \
            adaptible.wrap.ollama_context_test \
            adaptible.wrap.ollama_thinking_test \
            adaptible.wrap.source_lineage_test \
            adaptible.wrap.references_test adaptible.wrap.reference_integration_test \
            adaptible.wrap.grounding_quality_test adaptible.wrap.retention_test \
            adaptible.wrap.source_property_guard_test \
            adaptible.wrap.source_relevance_test \
            adaptible.wrap.training_resume_test \
            adaptible.wrap.thinking_retry_test \
            adaptible.wrap.training_budget_test \
            adaptible.wrap.training_optimizer_test \
            adaptible.wrap.training_examples_test \
            adaptible.wrap.lmstudio_test adaptible.wrap.vllm_test \
            adaptible.wrap.runtime_command_test \
            adaptible.wrap.model_source_test adaptible.wrap.gguf_adapter_test \
            adaptible.wrap.tokenizer_test \
            adaptible.wrap.loop_breaker_test scripts.wrapper_parity_test \
            adaptible.wrap.prompt_format_test \
            adaptible.wrap.ollama_fusion_test \
            scripts.wrapper_integration_test -v
